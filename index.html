<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ed">
<title>그림책 즉흥드로잉</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f7f3ed;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{width:min(92%,560px);margin:0 auto;padding:42px 0 32px;text-align:center}
h1{margin:0 0 8px;font-size:28px;font-weight:700;letter-spacing:-.04em}
.intro{margin:0 0 25px;color:#777;font-size:15px;line-height:1.6}
.cards{display:grid;gap:10px;margin-bottom:14px}
.card{background:#fff;border-radius:18px;padding:17px 18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.label{font-size:12px;color:#999;margin-bottom:6px}
.word{font-size:23px;font-weight:600;letter-spacing:-.03em;min-height:34px}
button{width:100%;border:0;border-radius:15px;background:#333;color:#fff;font-size:16px;font-weight:600;padding:16px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
.timer{margin:22px 0 12px;background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.timer-label{font-size:12px;color:#999;margin-bottom:4px}
.time{font-size:42px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.02em}
.timer-buttons{display:flex;gap:8px;margin-top:12px}
.timer-buttons button{font-size:14px;padding:12px;background:#777}
.timer-buttons button:first-child{background:#333}
footer{margin-top:20px;color:#aaa;font-size:12px}
</style>
</head>
<body>
<main>
<h1>그림책 즉흥드로잉</h1>
<p class="intro">세 가지 키워드를 뽑고,<br>10분 동안 자유롭게 그려보세요.</p>

<section class="cards">
<div class="card"><div class="label">명사</div><div class="word" id="noun">?</div></div>
<div class="card"><div class="label">동사</div><div class="word" id="verb">?</div></div>
<div class="card"><div class="label">형용사 · 상태</div><div class="word" id="adj">?</div></div>
</section>

<button id="draw">키워드 뽑기</button>

<section class="timer">
<div class="timer-label">10분 드로잉 타이머</div>
<div class="time" id="time">10:00</div>
<div class="timer-buttons">
<button id="start">시작</button>
<button id="reset">초기화</button>
</div>
</section>

<footer>같은 조합이 나와도 그림은 달라질 수 있어요.</footer>
</main>

<script>
const nouns=["우산","주머니","사다리","물고기","구름","신발","문","나무","그림자","달","풍선","창문","의자","돌멩이","상자","씨앗","기차","고양이","꽃병","모자","연못","편지","시계","빨간 장갑","작은 집","오래된 가방","빈 화분","커다란 나무","비눗방울","종이배"];
const verbs=["숨다","기다리다","쏟아지다","훔치다","도망가다","두드리다","따라오다","자라다","열리다","사라지다","넘어지다","날아가다","엿보다","기웃거리다","잡아당기다","밀어내다","뒤집히다","헤매다","발견하다","망설이다","기다려 주다","몰래 움직이다","따라가다","놓치다","돌아보다"];
const adjs=["너무 좁다","거꾸로다","비어 있다","무겁다","외롭다","열리지 않는다","부끄럽다","너무 작다","이상하다","축축하다","반짝인다","조용하다","엉뚱하다","낯설다","아슬아슬하다","늦었다","커다랗다","작고 단단하다","조금 무섭다","쓸쓸하다","엉망이다","아무도 모른다","아직 서툴다","괜히 신난다"];

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function draw(){
 document.querySelector("#noun").textContent=pick(nouns);
 document.querySelector("#verb").textContent=pick(verbs);
 document.querySelector("#adj").textContent=pick(adjs);
}
document.querySelector("#draw").addEventListener("click",draw);
draw();

let remaining=600;
let timer=null;

function renderTime(){
 const m=String(Math.floor(remaining/60)).padStart(2,"0");
 const s=String(remaining%60).padStart(2,"0");
 document.querySelector("#time").textContent=`${m}:${s}`;
}
function startTimer(){
 if(timer) return;
 if(remaining<=0) remaining=600;
 timer=setInterval(()=>{
   remaining--;
   renderTime();
   if(remaining<=0){
     clearInterval(timer);
     timer=null;
     if(navigator.vibrate) navigator.vibrate([300,150,300]);
     document.querySelector("#start").textContent="다시 시작";
   }
 },1000);
 document.querySelector("#start").textContent="일시정지";
}
function pauseTimer(){
 clearInterval(timer);
 timer=null;
 document.querySelector("#start").textContent="계속";
}
document.querySelector("#start").addEventListener("click",()=>{
 if(timer) pauseTimer(); else startTimer();
});
document.querySelector("#reset").addEventListener("click",()=>{
 clearInterval(timer);
 timer=null;
 remaining=600;
 renderTime();
 document.querySelector("#start").textContent="시작";
});
renderTime();
</script>
</body>
</html>
